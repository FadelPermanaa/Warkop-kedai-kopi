<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Masuk — Kasir Warkop</title>
  <link rel="icon" href="/img/favicon.svg">
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <main class="login-wrap">
    <div class="login">
      <div class="mark"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10h13v4a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5v-4Z"/><path d="M17 11h1.5a2.5 2.5 0 0 1 0 5H17"/><path d="M8 3c0 1.5 1 1.5 1 3M12 3c0 1.5 1 1.5 1 3"/></svg></div>
      <h1 data-shop>Kasir Warkop</h1>
      <p class="muted">Masuk untuk mulai melayani.</p>
      <form id="form" novalidate>
        <label class="field"><span>Nama pengguna</span><input name="username" autocomplete="username" autocapitalize="none" required></label>
        <label class="field"><span>Kata sandi</span><input name="password" type="password" autocomplete="current-password" required></label>
        <p class="alert bad" id="err" hidden></p>
        <button class="btn lg block" type="submit">Masuk</button>
      </form>
    </div>
  </main>
  <script src="/js/app.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
